<nav class="navbar navbar-expand-lg navbar-dark navbar-avetrana sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-flag-fill me-2"></i>Avetrana Eventi &amp; Tradizioni
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/eventi" routerLinkActive="active">Eventi</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/mappa" routerLinkActive="active">Mappa</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/avvisi" routerLinkActive="active">Avvisi</a>
        </li>
        @if (authService.isAdmin()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active">Admin Dashboard</a>
          </li>
        }
      </ul>

      <ul class="navbar-nav">
        <li class="nav-item d-flex align-items-center me-2">
          <button type="button" class="btn btn-outline-light btn-sm theme-toggle-btn"
                  (click)="themeService.toggle()"
                  [attr.aria-label]="themeService.isDark() ? 'Attiva tema chiaro' : 'Attiva tema scuro'"
                  [title]="themeService.isDark() ? 'Tema chiaro' : 'Tema scuro'">
            <i class="bi" [ngClass]="themeService.isDark() ? 'bi-sun-fill' : 'bi-moon-stars-fill'"></i>
          </button>
        </li>
        @if (authService.isAuthenticated()) {
          <li class="nav-item d-flex align-items-center">
            <span class="navbar-text text-white me-3">
              <i class="bi bi-person-circle me-1"></i>{{ authService.currentUser()?.username }}
            </span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" (click)="logout()">Esci</button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="btn btn-outline-light btn-sm" routerLink="/login">Accedi</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
