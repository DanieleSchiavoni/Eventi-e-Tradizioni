<div class="container py-5" style="max-width: 480px;">
  <h2 class="mb-4 text-center">Crea un account</h2>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" class="form-control" formControlName="nome"
             [class.is-invalid]="form.get('nome')?.invalid && form.get('nome')?.touched">
      <div class="invalid-feedback">Il nome e' obbligatorio.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Cognome</label>
      <input type="text" class="form-control" formControlName="cognome"
             [class.is-invalid]="form.get('cognome')?.invalid && form.get('cognome')?.touched">
      <div class="invalid-feedback">Il cognome e' obbligatorio.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email"
             [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
      <div class="invalid-feedback">Inserisci un'email valida.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" formControlName="password"
             [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
      <div class="invalid-feedback">Minimo 6 caratteri.</div>
    </div>

    <button type="submit" class="btn btn-avetrana w-100" [disabled]="loading">
      @if (loading) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Registrati
    </button>

    <p class="text-center mt-3 mb-0">
      Hai gia' un account? <a routerLink="/login">Accedi</a>
    </p>
  </form>
</div>
