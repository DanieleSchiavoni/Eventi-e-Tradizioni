<div class="container py-5" style="max-width: 480px;">
  <h2 class="mb-4 text-center">Accedi</h2>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email"
             [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched">
      <div class="invalid-feedback">Inserisci un'email valida.</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" formControlName="password"
             [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
      <div class="invalid-feedback">La password e' obbligatoria.</div>
    </div>

    <button type="submit" class="btn btn-avetrana w-100" [disabled]="loading">
      @if (loading) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Accedi
    </button>

    <p class="text-center mt-3 mb-0">
      Non hai un account? <a routerLink="/register">Registrati</a>
    </p>
  </form>

  <div class="alert alert-secondary mt-4 small">
    Demo admin: <strong>admin&#64;avetrana.it</strong> / <strong>Admin123!</strong>
  </div>
</div>
